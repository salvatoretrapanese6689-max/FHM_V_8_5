<title>Family Hub Manager 8.6</title>
<style>
:root{--bg:#0B0F1A;--sf:#101a33;--tx:#f2f6ff;--mu:#a7b5cf;--ac:#00A3FF;--ac2:#16264a;--ln:#26386a;--rd:#ff3d5a;--pos:#39ff6a;color-scheme:dark}

*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:16px/1.45 "Avenir Next","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top)}
header{padding:18px 20px 6px}
header h1{font-size:24px;font-weight:700;letter-spacing:-.01em}
header p{color:var(--mu);font-size:14px}
main{flex:1;overflow-y:auto;padding:12px 20px 24px}
nav{display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;background:none;border:0;color:var(--mu);padding:10px 2px 8px;font:inherit;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav button span{font-size:20px}
nav button.on{color:var(--ac);font-weight:700}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.seg{display:flex;gap:6px;background:var(--ac2);padding:4px;border-radius:12px;margin-bottom:14px}
.seg button{flex:1;border:0;background:none;color:var(--tx);padding:9px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer}
.seg button.on{background:var(--ac);color:#fff}
.hint{color:var(--mu);font-size:14px;margin-bottom:10px}
ul{list-style:none}
ul ul{margin-left:12px;padding-left:10px;border-left:2px solid var(--ln)}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--ln)}
.row .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.l1 .nm{font-weight:700}
.l3 .nm{color:var(--mu)}
.acts{display:flex;gap:2px}
.acts button{background:none;border:0;font-size:18px;width:40px;height:40px;border-radius:10px;cursor:pointer;color:var(--ac)}
.acts button[data-a=del]{color:var(--rd)}
.empty{color:var(--mu);padding:18px 0}
.primary,.danger{border:0;border-radius:12px;padding:13px 16px;font:inherit;font-weight:700;cursor:pointer;color:#fff;background:var(--ac)}
.danger{background:var(--rd)}
.wide{width:100%;margin-top:16px}
.soon{text-align:center;padding:56px 12px;color:var(--mu)}
.soon .big{font-size:44px;display:flex;justify-content:center}
.soon h2{color:var(--tx);margin:8px 0 4px}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--ln);margin-bottom:14px}
.tabs button{background:none;border:0;color:var(--mu);font:inherit;font-weight:600;padding:8px 0;border-bottom:3px solid transparent;cursor:pointer}
.tabs button.on{color:var(--ac);border-color:var(--ac)}
.yr{display:flex;align-items:center;justify-content:center;gap:14px}
.yr button{background:none;border:0;font-size:26px;color:var(--ac);width:44px;height:44px;cursor:pointer}
.bal{padding:14px 16px;margin-bottom:10px;background:var(--sf);border:1px solid var(--ln);border-radius:16px}
.bal p{color:var(--mu)}
.bal strong{display:block;font-size:38px;letter-spacing:-.02em;line-height:1.15}
.bal.pos strong,.bal.pos span{color:var(--ac)}
.bal.neg strong,.bal.neg span{color:var(--rd)}
.bal span{font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two div{padding:12px;border:1px solid;border-radius:14px}
.two div:first-child{background:#0f2a1c;border-color:#1f6b3a}
.two div:last-child{background:#2a1118;border-color:#6b2433}
.two p{color:var(--mu);font-size:14px}
.two strong{font-size:20px}
h2{font-size:16px;margin:22px 0 10px}
.bar{margin-bottom:12px}
.bl{display:flex;justify-content:space-between;gap:8px;margin-bottom:4px}
.tr{height:8px;background:var(--ac2);border-radius:4px;overflow:hidden}
.tr i{display:block;height:100%;background:var(--rd)}
.mon{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.cols{height:90px;display:flex;align-items:flex-end;gap:1px}
.cols i{flex:1;display:block;min-height:2px;border-radius:2px 2px 0 0}
.c1{background:var(--ac)}
.c2{background:var(--rd)}
.mon small{display:block;text-align:center;color:var(--mu);font-size:10px;margin-top:3px}
.leg{color:var(--mu);font-size:13px;margin-top:8px}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin:0 4px 0 8px}
.leg i:first-child{margin-left:0}
.two small{display:block;color:var(--mu);font-size:12px}
.row small{display:block;color:var(--mu);font-size:13px}
.row strong.out{color:var(--rd)}
.row strong.in{color:var(--ac)}
h1 small{font-size:12px;color:var(--mu);font-weight:600}
.subnav{display:flex;gap:6px;background:var(--sf);border-top:1px solid var(--ln);padding:8px 12px;overflow-x:auto}
.subnav[hidden]{display:none}
.subnav button{flex:none;border:0;background:var(--ac2);color:var(--tx);font:inherit;font-weight:600;font-size:14px;padding:8px 14px;border-radius:999px;cursor:pointer}
.subnav button.on{background:var(--ac);color:#fff}
#frm,#pick{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);z-index:20}
#pick{z-index:30}
#frm[hidden],#pick[hidden]{display:none}
.fbar{display:flex;align-items:center;gap:8px;padding:12px 12px 4px}
.fbar button{background:none;border:0;font-size:24px;color:var(--ac);width:44px;height:44px;cursor:pointer}
.fbar strong{font-size:18px}
.fbody{flex:1;overflow-y:auto;padding:4px 20px calc(20px + env(safe-area-inset-bottom))}
.fld{display:block;margin-top:14px}
.fld>span{display:block;color:var(--mu);font-size:14px;margin-bottom:4px}
.fld input{width:100%;font:inherit;padding:12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--tx)}
.catb{width:100%;text-align:left;font:inherit;padding:12px;border:1px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--tx);cursor:pointer}
.amt{font-size:36px;font-weight:700;letter-spacing:-.02em;text-align:center;padding:4px 0 2px}
.amt.out{color:var(--rd)}
.amt.in{color:var(--ac)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.slb{display:block;color:var(--mu);font-size:14px;margin-top:16px}
.pad button{font:inherit;font-size:20px;font-weight:600;padding:9px 0;border:0;border-radius:12px;background:var(--ac2);color:var(--tx);cursor:pointer}
.err{color:var(--rd);font-size:14px;min-height:20px;margin:6px 0}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.chips button{border:0;background:var(--ac2);color:var(--tx);font:inherit;font-size:14px;padding:7px 12px;border-radius:999px;cursor:pointer}
.plist .nm,.erow{cursor:pointer}
.plist .nm{padding:6px 0}
#ced{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top);z-index:35}
#ced[hidden]{display:none}
.tb{width:auto!important;font-size:16px!important;font-weight:700;padding:0 8px}
.prev{display:flex;justify-content:center;margin:8px 0 4px}

nav button{flex:none;min-width:0;padding:8px 0 6px;font-size:clamp(9px,2.7vw,11px);letter-spacing:0;overflow:hidden}

.bcard.sub{margin-left:10px;border-left:3px solid var(--ac)}
.btile{text-align:left;font:inherit;color:inherit;cursor:pointer;border:1.5px solid var(--ac)!important;border-radius:14px;background:var(--ac2);padding:10px 12px}
.bsum small{display:block}
.bsum .wide2{grid-column:1/-1}
.bmr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;font-size:12px;color:var(--ac)}
.bmr button{border:1px solid var(--ac);background:transparent;color:var(--ac);border-radius:8px;padding:5px 10px;font-size:12px;cursor:pointer}
.npi{width:100%;box-sizing:border-box;margin:8px 0 14px;padding:12px;font-size:20px;border-radius:12px;border:1px solid var(--ln);background:var(--ac2);color:var(--tx)}
.npi.bad{border-color:var(--rd)}
#dlg .bt{flex-wrap:wrap}
.bcard.grp{border:1.5px solid var(--ac);margin-top:16px}
.bcard.grp .gp{color:var(--ac);font-size:15px}
.bcard.sub.d2{margin-left:24px}
.bcard.sub.d3{margin-left:38px}
.bgs{margin:2px 0 8px 10px;font-size:13px;color:var(--mu)}
.bgs.ok{color:var(--pos)}
.bgs.bad{color:var(--rd);font-weight:600}
.rcs{display:block;width:100%;box-sizing:border-box;margin:10px 0;padding:11px 14px;border:1.5px dashed var(--ac);border-radius:14px;background:transparent;color:var(--ac);font:inherit;font-weight:600;cursor:pointer}
.rcl{display:flex;gap:8px;align-items:stretch;margin-bottom:8px}
.rcl .catb{flex:1;min-width:0}
.rcl input{width:104px;box-sizing:border-box;padding:10px;font-size:16px;border-radius:12px;border:1px solid var(--ln);background:var(--ac2);color:var(--tx);text-align:right}
.rcl .rx{width:40px;flex:none;border-radius:12px;border:1px solid var(--ln);background:transparent;color:var(--rd);font-size:18px;cursor:pointer;padding:0}
.rct{display:flex;justify-content:space-between;align-items:center;margin:10px 0 14px;padding:11px 14px;border:1.5px solid var(--ac);border-radius:14px;background:var(--ac2);font-size:17px}
.rct strong{font-size:20px}
</style>

}

async function fclick(e){
  const b=e.target.closest('[data-f]');if(!b)return;
  const f=b.dataset.f,v=b.dataset.v;
  if(f==='close'){closeForm();return}
  if(f==='type'){syncF();if(F.type!==v){F.type=v;F.cat=null;F.car=null;F.bp=0}drawForm();return}
  if(f==='cat'){openPick(F.type,id=>{F.cat=id;F.car=null;F.bp=0;drawForm();if(needsCar(id))askCarF()});return}
  if(f==='car'){syncF();askCarF();return}
  if(f==='bpm'||f==='bpp'){F.bp=Math.max(0,(F.bp||0)+(f==='bpp'?1:-1));document.getElementById('fbp').value=F.bp;updBp();return}
  if(f==='bpx'){F.bp=F.rcpt?Math.max(0,Math.min(rcAvail(),Math.floor((rcTotal()+1e-9)/fbv()))):Math.max(0,Math.min(bpStock().c,Math.floor(cashN()/BPV())));document.getElementById('fbp').value=F.bp;updBp();return}
  if(f==='rcnew'){syncF();openReceipt(null,{date:F.date,note:F.note});return}
  if(f==='rcadd'){syncF();F.lines.push({cat:null,amt:'',car:null});drawForm();return}
  if(f==='rcdel'){syncF();F.lines.splice(+v,1);if(!F.lines.length)F.lines.push({cat:null,amt:'',car:null});drawForm();return}
  if(f==='rccat'){syncF();const i=+v;openPick('out',id=>{const l=F.lines[i];l.cat=id;l.car=null;drawForm();if(needsCar(id))askCarLine(i)});return}
  if(f==='rccar'){syncF();askCarLine(+v);return}
  if(f==='rcsave'){await saveReceipt();return}
  if(f==='rcdelall'){
    const n=D.entries.filter(x=>x.rcpt===F.rc).length;
    const ok=await dlg({t:'Eliminare lo scontrino?',p:'Verranno eliminate le '+n+' registrazioni collegate. Non si può annullare.',ok:'Elimina',d:1});
    if(ok){const r=F.rc;D.entries=D.entries.filter(x=>x.rcpt!==r);save();closeForm()}
    return;
  }
  if(f==='pclose'){document.getElementById('pick').hidden=true;return}
  if(f==='pk'){document.getElementById('pick').hidden=true;PK.cb(v);return}
  if(f==='pnew'||f==='padd'){
    const id=await catEd({type:PK.t,parentId:f==='padd'?v:null});
    if(id){document.getElementById('pick').hidden=true;PK.cb(id)}
    return;
  }
  if(f==='k'){
    let a=F.amt;
    if(v==='⌫')a=a.slice(0,-1);
    else if(v===','){if(!a.includes(','))a=(a||'0')+','}
    else{if(a==='0')a='';const p=a.split(',');if(p.length>1?p[1].length<2:p[0].length<7)a+=v}
    F.amt=a;document.querySelector('#frm .amt').textContent='€ '+(a||'0');updBp();return;
  }
  if(f==='save'){
    syncF();const n=parseFloat((F.amt||'0').replace(',','.'))||0;
    const nb=needsBp(F.cat)?Math.max(0,F.bp||0):0,bv=fbv(),tot=F.type==='in'?n+nb*bv:n;
    if(!(tot>0))return drawForm('Inserisci un importo maggiore di zero.');
    if(F.type==='out'&&nb*bv>n+0.001)return drawForm('Con '+nb+' buoni copri '+eur(nb*bv)+', più dell’importo ('+eur(n)+'). Riduci i buoni.');
    if(!F.cat||!find(F.cat))return drawForm('Scegli una categoria.');
    if(!F.date)return drawForm('Scegli una data.');
    if(needsCar(F.cat)&&D.cars.some(c=>!c.hidden)&&!F.car)return drawForm('Scegli l’automobile (o “Nessuna auto”).');
    if(F.rec){
      const nm=F.name.trim();if(!nm)return drawForm('Scrivi un nome.');
      const o={name:nm,type:F.type,catId:F.cat,amount:Math.round(tot*100)/100,bp:nb,bpv:nb?bv:0,n:F.n,next:F.date,day:+F.date.slice(8),active:F.rid?F.active:true,carId:needsCar(F.cat)&&F.car&&F.car!=='none'?F.car:null},t=today();
      if(o.active&&o.next<=t){
        let d=o.next,c=0;while(d<=t&&c<60){c++;d=addM(d,o.n,o.day)}
        const ok=await dlg({t:'Prima scadenza nel passato',p:`Verranno registrate subito ${c} registrazioni${c>=60?' (il massimo)':''}, a partire dal ${o.next.split('-').reverse().join('/')}. Per non registrarle, scegli una data futura.`,ok:'Registra',d:1});
        if(!ok)return;
      }
      if(F.rid)Object.assign(D.rec.find(x=>x.id===F.rid),o);else D.rec.push({id:uid(),...o});
      save();runRec();closeForm();return;
    }
    D.entries=D.entries||[];
    const o={type:F.type,date:F.date,catId:F.cat,amount:Math.round(tot*100)/100,bp:nb,bpv:nb?bv:0,note:F.note.trim(),carId:needsCar(F.cat)&&F.car&&F.car!=='none'?F.car:null};
    if(F.id)Object.assign(D.entries.find(x=>x.id===F.id),o);else D.entries.push({id:uid(),...o});
    F._saved=true;save();closeForm();return;
  }
  if(f==='rdel'){
    const ok=await dlg({t:'Eliminare la ricorrenza?',p:'Le registrazioni già create restano. Non si può annullare.',ok:'Elimina',d:1});
    if(ok){D.rec=D.rec.filter(x=>x.id!==F.rid);save();closeForm()}
    return;
  }
  if(f==='del'){
    const ok=await dlg({t:'Eliminare la registrazione?',p:'Non si può annullare.',ok:'Elimina',d:1});
    if(ok){D.entries=D.entries.filter(x=>x.id!==F.id);save();closeForm()}
  }
}

function openTxt(mode){
  const w=document.getElementById('txt'),copy=mode==='copy';
  const txt=copy?JSON.stringify({app:'family-hub-manager',v:VER,created:new Date().toISOString(),data:D}):'';
  w.innerHTML=`<div class="fbar"><button data-x="close" aria-label="Indietro">‹</button><strong>${copy?'Copia i dati':'Ripristina da testo'}</strong></div><div class="fbody"><p class="hint">${copy?'Questo è il testo di tutti i tuoi dati ('+txt.length.toLocaleString('it-IT')+' caratteri). Tocca “Copia tutto” e incollalo in un posto sicuro (Note, Messaggi salvati…). I file dei documenti non sono inclusi.':'Incolla qui il testo copiato prima, poi tocca “Ripristina”. Prima di sostituire i dati ti chiedo conferma.'}</p><textarea id="txa" class="txa" ${copy?'readonly':''} placeholder="Incolla qui…" autocomplete="off" spellcheck="false"></textarea><button class="primary wide" data-x="${copy?'copy':'go'}">${copy?'Copia tutto':'Ripristina'}</button></div>`;
  const ta=w.querySelector('#txa');ta.value=txt;w.hidden=false;
  if(copy){ta.focus();ta.select()}
}
document.getElementById('txt').onclick=async e=>{
  const b=e.target.closest('[data-x]');if(!b)return;const x=b.dataset.x,ta=document.getElementById('txa'),w=document.getElementById('txt');
  if(x==='close'){w.hidden=true;return}
  if(x==='copy'){
    ta.focus();ta.select();try{ta.setSelectionRange(0,ta.value.length)}catch(e0){}
    let ok=false;
    try{await navigator.clipboard.writeText(ta.value);ok=true}catch(e1){try{ta.focus();ta.select();ok=document.execCommand('copy')}catch(e2){}}
    toast(ok?'Copiato: ora incollalo in un posto sicuro':'Copia non riuscita: tieni premuto sul testo, scegli “Seleziona tutto” e poi “Copia”');return;
  }
  if(x==='go'){
    const t=ta.value.trim();if(!t){toast('Incolla prima il testo dei dati');return}
    const before=D;
    await restoreFile({target:{files:[new File([t],'incollato.json',{type:'application/json'})],value:''}});
    if(D!==before)w.hidden=true;
  }
};
function openSettings(){drawSettings();document.getElementById('set').hidden=false}
document.getElementById('gear').onclick=openSettings;
document.getElementById('home').onclick=()=>{area='dash';render();window.scrollTo(0,0)};
const today2=()=>today();
document.getElementById('set').onclick=async e=>{
  const b=e.target.closest('[data-k]');if(!b)return;const k=b.dataset.k;
  if(k==='ctxt'){openTxt('copy');return}
  if(k==='rtxt'){openTxt('paste');return}
  if(k==='car-add'){const n=await dlg({t:'Nuova automobile',i:1,ok:'Aggiungi'});if(n){D.cars.push({id:uid(),name:n});save();drawSettings()}return}
  if(k==='car-ren'){const c=D.cars.find(x=>x.id===b.dataset.v);const n=await dlg({t:'Rinomina automobile',i:1,v:c.name,ok:'Salva'});if(n){c.name=n;save();drawSettings()}return}

    const ok=await dlg({t:'Eliminare la categoria?',p:`“${esc(c.name)}”${k?` e le sue ${k} sotto categorie`:''} verrà eliminata.${u?` ${u} voci collegate resteranno senza categoria.`:''}${rc.length?` ${rc.length} ricorrenz${rc.length===1?'a collegata verrà sospesa':'e collegate verranno sospese'}.`:''} Non si può annullare.`,ok:'Elimina',d:1});
    if(ok){rc.forEach(r=>{r.active=false});D.categories=D.categories.filter(x=>x.id!==id&&!ids.includes(x.id));save();render()}
  }
};
runRec();runSca();render();showSaveErr();
document.addEventListener('visibilitychange',()=>{if(!document.hidden){runRec();runSca();render()}});
</script>
